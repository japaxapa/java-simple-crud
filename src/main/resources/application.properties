spring.application.name=simplestcrud
server.port=8081

# 1. Database Connection (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:simplestcrud
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 2. Hibernate Configuration
# update: Hibernate will automatically create/alter tables based on our @Entity classes
spring.jpa.hibernate.ddl-auto=update
# This prints the SQL queries to the console so we can see what the database is doing!
spring.jpa.show-sql=true
# Formats the SQL nicely so it's easier to read
spring.jpa.properties.hibernate.format_sql=true

# 3. H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console